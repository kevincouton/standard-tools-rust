name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install tools
        run: mise install

      - name: Format
        run: mise run fmt -- --check

      - name: Clippy
        run: mise run clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install tools
        run: mise install

      - name: Run tests with visual report
        run: |
          set -o pipefail
          mise run test 2>&1 | tee test-output.log
          ./scripts/visual-test-report.sh test-output.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.html

  build-images:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build classic image
        run: podman build -f Dockerfile -t standard-tools:latest .

      - name: Build native image
        run: podman build -f Dockerfile.native -t standard-tools:native .
