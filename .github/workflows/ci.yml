name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install tools
        run: mise install

      - name: Install rustfmt
        run: mise exec -- rustup component add rustfmt

      - name: Format
        run: mise run fmt -- --check

      - name: Clippy
        run: mise run clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install tools
        run: mise install

      - name: Install rustfmt
        run: mise exec -- rustup component add rustfmt

      - name: Run tests with visual report
        run: mise run test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: test-report
          path: test-report.html

  build-images:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build classic image
        run: podman build -f Dockerfile -t standard-tools:latest .

      - name: Build native image
        run: podman build -f Dockerfile.native -t standard-tools:native .
