[tools]
rust = "latest"
podman = "latest"
act = "0.2.75"

[tasks]
build = "cargo build --workspace"
test = "bash -c 'set -o pipefail; cargo test --workspace 2>&1 | tee test-output.log && ./scripts/visual-test-report.sh test-output.log test-report.html'"
test-integration = "cargo test --workspace --all-targets"
clippy = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all"
doc = "cargo doc --workspace --no-deps"
db-up = "docker compose up -d postgres"
migrate = "sqlx migrate run"
run = "cargo run -p sqt-api"
image = "podman build -f Dockerfile -t standard-tools:latest ."
image-native = "podman build -f Dockerfile.native -t standard-tools:native ."
act = "./scripts/run-act-local.sh"
